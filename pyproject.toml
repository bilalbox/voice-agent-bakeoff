[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.basedpyright]
typeCheckingMode = "standard"
reportMissingImports = false

[tool.vulture]
min_confidence = 80
paths = ["apps/agent-livekit"]
exclude = [".venv/", "vulture_whitelist.py"]
